meta:
  target_per_market: 10
  markets:
  - DK
  - DE
  - IE
  probe_baseline: 2026-09-15
  note: 'Phase 1 markets chosen so no two test the same failure mode: DK is non-euro
    with comma decimals, DE is comma decimals in euro with the SF-Klassen bonus system,
    IE is English with POINT decimals in euro. FR and NL are the planned phase-2 extension
    and are carried here unprobed.

    '
