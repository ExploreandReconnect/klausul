- id: eu-eiopa-template
  market: EU
  insurer: EIOPA
  product: Editable IPID template + icon set
  doc_type: template
  language: multi
  url: https://www.eiopa.europa.eu/browse/regulation-and-policy/insurance-distribution-directive-idd/editable-template-insurance-product-information-document-ipid_en
  route: open
  probed: 2026-09-15
  findings:
  - 'EIOPA states manufacturers "are not obliged to use these specific files and may
    choose instead to develop their own IPIDs that meet the requirements of the IPID
    Implementing Regulation." Confirms the container is required but the realisation
    is not — section matching must be semantic, not positional.

    '
  - Templates exist in multiple EU languages; useful as a translation cross-check
    for app/vocab.py.
