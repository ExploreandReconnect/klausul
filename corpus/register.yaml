- id: ie-aviva-motorcare
  market: IE
  insurer: Aviva Insurance Ireland DAC
  product: MotorCare
  doc_type: ipid
  language: en
  url: https://static.aviva.io/content/dam/aviva-public/ie/pdfs/motorcare-ipid.pdf
  route: open
  probed: '2026-09-16'
  findings:
  - EIGHT sections, not nine. "What is this type of insurance?" absent.
  - Order deviates from the Annex: restrictions AFTER territory; cancel BEFORE start/end.
  - Standard excess EUR 300; conditional additional excess EUR 2,500 for undisclosed
    penalty points.
  - Territory is a LIST plus a time-limited extension ("identical cover in the EU
    for up to 31 days").
  - Courtesy car is conditional on using the insurer's own repair network.
  note: 'READ 2026-09-16: 8 sections, non-canonical order. Excess EUR300, conditional
    EUR2,500, windscreen EUR225. EU cover 31 days.'
  found_by: web search
  local: corpus\pdf\IE\ie-aviva-motorcare.pdf
  bytes: 56773
